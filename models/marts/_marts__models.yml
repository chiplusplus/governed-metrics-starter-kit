version: 2

models:
  - name: fct_order_items
    description: "One row per order line item. Adds item_revenue (quantity × unit_price)."
    columns:
      - name: order_item_id
        description: "Unique identifier for the line item."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to the parent order."
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_name
        description: "Name of the product."
      - name: quantity
        description: "Units ordered."
      - name: unit_price
        description: "Price per unit at time of order."
      - name: item_revenue
        description: "Line-item revenue (quantity × unit_price), rounded to 2 decimal places."
        tests:
          - not_null

  - name: fct_orders
    description: >
      One row per order. Aggregates line items to produce gross_revenue, then
      computes net_revenue after discounts and refunds.
    columns:
      - name: order_id
        description: "Unique identifier for the order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to the customer who placed the order."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_date
        description: "Date the order was placed."
      - name: status
        description: "Fulfillment status of the order."
      - name: discount_amount
        description: "Monetary discount applied to the order."
      - name: refund_amount
        description: "Monetary amount refunded on the order."
      - name: item_count
        description: "Number of distinct line items in the order."
      - name: gross_revenue
        description: "Sum of item_revenue across all line items in the order."
        tests:
          - not_null
      - name: net_revenue
        description: "gross_revenue minus refund_amount and discount_amount."
        tests:
          - not_null

  - name: dim_customers
    description: "One row per customer. Pass-through from stg_customers."
    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        tests:
          - unique
          - not_null
      - name: first_name
        description: "Customer's first name."
      - name: last_name
        description: "Customer's last name."
      - name: email
        description: "Customer's email address."
        tests:
          - not_null
      - name: country
        description: "Country where the customer is based (ISO 2-letter code)."
      - name: marketing_channel
        description: "Customer acquisition channel."
      - name: created_at
        description: "Date the customer account was created."
