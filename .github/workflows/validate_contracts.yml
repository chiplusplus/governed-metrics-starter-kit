name: Validate Metric Contracts

on:
  pull_request:
    branches:
      - master

jobs:
  # ── 1. Governance contracts ─────────────────────────────────────────────────
  # Custom Python validator enforcing business-logic and governance rules
  # (baseline fields, tier tags, revenue labels, PII/join/raw-column safety).
  validate:
    name: Governance contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test_validate_contracts.py -v

      - name: Run contract validator
        run: python validate_contracts.py

  # ── 2. dbt compile ──────────────────────────────────────────────────────────
  # Validates SQL syntax and ref() resolution without executing queries.
  # Steps after the secrets check are skipped automatically when DBT_HOST is
  # absent (e.g. forks / external contributors), so the job always passes.
  # Set DBT_HOST, DBT_USER, DBT_PASSWORD, DBT_DBNAME as repository secrets
  # to enable compilation.
  dbt-compile:
    name: dbt compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check DB secrets are configured
        id: check
        env:
          DBT_HOST: ${{ secrets.DBT_HOST }}
        run: |
          if [ -n "$DBT_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping dbt compile — DBT_HOST secret not set."
          fi

      - name: Set up Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Write profiles.yml
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.dbt
          cat << 'EOF' > ~/.dbt/profiles.yml
          governed_metrics:
            target: ci
            outputs:
              ci:
                type: postgres
                host: ${{ secrets.DBT_HOST }}
                port: 5432
                user: ${{ secrets.DBT_USER }}
                password: ${{ secrets.DBT_PASSWORD }}
                dbname: ${{ secrets.DBT_DBNAME }}
                schema: ci_compile
                threads: 4
                sslmode: require
          EOF

      - name: dbt compile
        if: steps.check.outputs.configured == 'true'
        run: dbt compile

  # ── 3. Lightdash lint ───────────────────────────────────────────────────────
  # Validates YAML files against Lightdash JSON schemas (structural check —
  # no credentials or live instance required).
  lightdash-lint:
    name: Lightdash lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lightdash CLI
        run: npm install -g @lightdash/cli

      - name: Lightdash lint
        run: lightdash lint
